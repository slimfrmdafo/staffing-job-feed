name: Hourly staffing feed
on:
  workflow_dispatch:
    inputs:
      timer_run_id:
        description: Cloud timer receipt (set automatically by cloud clock)
        type: string
        default: ''
      timer_fired_at:
        description: Actual cloud timer time (set automatically)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: staffing-cloud
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and atomically publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAFFING_REPO: ${{ github.repository }}
          STAFFING_TIMER_RUN_ID: ${{ inputs.timer_run_id }}
          STAFFING_TIMER_FIRED_AT: ${{ inputs.timer_fired_at }}
        run: python pipeline.py --route cloud --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-result-${{ github.run_id }}
          path: |
            run-result.json
            diagnostics/
          retention-days: 14
