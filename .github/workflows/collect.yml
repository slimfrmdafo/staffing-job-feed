name: Hourly staffing feed
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staffing-cloud
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and atomically publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAFFING_REPO: ${{ github.repository }}
        run: python pipeline.py --route cloud --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-result-${{ github.run_id }}
          path: |
            run-result.json
            diagnostics/
          retention-days: 14
